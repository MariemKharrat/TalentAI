server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the runtime config so API_BASE_URL changes take effect on reload.
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
